name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Import the Developer ID cert into a throwaway keychain when the signing
      # secrets exist. Without them the build proceeds unsigned (current behavior).
      - name: Import signing certificate
        id: signing
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "::warning::MACOS_CERT_P12_BASE64 not set — building UNSIGNED (homebrew/cask will reject). See docs/GROWTH.md Track A."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          echo "Found identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build .app
        env:
          # Sign when an identity was imported above.
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          # Bake the flywheel analytics endpoint into the release (option_env!);
          # absent → the in-app SDK ships dark. See src/flywheel.rs.
          FLYWHEEL_SUPABASE_URL: ${{ secrets.FLYWHEEL_SUPABASE_URL }}
          FLYWHEEL_SUPABASE_KEY: ${{ secrets.FLYWHEEL_SUPABASE_KEY }}
        run: ./scripts/bundle.sh

      - name: Build DMG
        run: ./scripts/dmg.sh

      - name: Notarize + staple DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/notarize.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping cask update."
            echo "One-time setup:"
            echo "  1. Create a fine-grained PAT at https://github.com/settings/personal-access-tokens/new"
            echo "     - Resource owner: Chartres"
            echo "     - Repository access: Only select repositories → homebrew-mac-dir-stat"
            echo "     - Permissions: Contents → Read and write"
            echo "  2. gh secret set HOMEBREW_TAP_TOKEN -R Chartres/mac-dir-stat -b \"<token>\""
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="dist/MacDirStat-${VERSION}.dmg"
          SHA256=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "Bumping cask to $VERSION ($SHA256)"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Chartres/homebrew-mac-dir-stat.git" tap
          cd tap
          sed -i.bak -E "s/^([[:space:]]*version )\"[^\"]+\"/\\1\"${VERSION}\"/" Casks/mac-dir-stat.rb
          sed -i.bak -E "s/^([[:space:]]*sha256 )\"[^\"]+\"/\\1\"${SHA256}\"/" Casks/mac-dir-stat.rb
          rm Casks/mac-dir-stat.rb.bak
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mac-dir-stat.rb
          if git diff --staged --quiet; then
            echo "Cask already up to date."
          else
            git commit -m "mac-dir-stat ${VERSION}"
            git push
          fi
