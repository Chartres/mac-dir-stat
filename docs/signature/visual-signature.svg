<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" fill="#1f1d1a">
<title>Visual signature</title>
<rect width="900" height="460" fill="#f6f2ea"/>
<text x="32" y="44" font-size="20" fill="#1f1d1a" text-anchor="start" font-weight="normal">Visual signature — the survey register</text>
<text x="32" y="66" font-size="12" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">Book typography (Bringhurst 1992) and the printed survey map</text>
<line x1="32" y1="80" x2="868" y2="80" stroke="#1f1d1a" stroke-width="1"/>
<text x="32" y="130" font-size="34" fill="#1f1d1a" text-anchor="start" font-weight="normal">MacDirStat</text>
<text x="32" y="160" font-size="14" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">Macintosh HD · 653 GB used of 994 GB · scanned 29 October 2026</text>
<text x="32" y="200" font-size="14" fill="#1f1d1a" text-anchor="start" font-weight="normal">Serif for headings and labels, tabular figures for sizes, italics for notes.</text>
<rect x="32" y="240" width="60" height="60" fill="#f6f2ea" stroke="#1f1d1a" stroke-width="1"/>
<text x="32" y="320" font-size="12" fill="#1f1d1a" text-anchor="start" font-weight="normal">paper</text>
<text x="32" y="336" font-size="11" fill="#6b655c" text-anchor="start" font-weight="normal">#f6f2ea</text>
<rect x="202" y="240" width="60" height="60" fill="#1f1d1a" stroke="#1f1d1a" stroke-width="1"/>
<text x="202" y="320" font-size="12" fill="#1f1d1a" text-anchor="start" font-weight="normal">ink</text>
<text x="202" y="336" font-size="11" fill="#6b655c" text-anchor="start" font-weight="normal">#1f1d1a</text>
<rect x="372" y="240" width="60" height="60" fill="#6b655c" stroke="#1f1d1a" stroke-width="1"/>
<text x="372" y="320" font-size="12" fill="#1f1d1a" text-anchor="start" font-weight="normal">note</text>
<text x="372" y="336" font-size="11" fill="#6b655c" text-anchor="start" font-weight="normal">#6b655c</text>
<rect x="542" y="240" width="60" height="60" fill="#b9b2a5" stroke="#1f1d1a" stroke-width="1"/>
<text x="542" y="320" font-size="12" fill="#1f1d1a" text-anchor="start" font-weight="normal">rule</text>
<text x="542" y="336" font-size="11" fill="#6b655c" text-anchor="start" font-weight="normal">#b9b2a5</text>
<rect x="712" y="240" width="60" height="60" fill="#7a2a20" stroke="#1f1d1a" stroke-width="1"/>
<text x="712" y="320" font-size="12" fill="#1f1d1a" text-anchor="start" font-weight="normal">oxblood</text>
<text x="712" y="336" font-size="11" fill="#6b655c" text-anchor="start" font-weight="normal">#7a2a20 — one action per window</text>
<rect x="32" y="370" width="56" height="30" fill="#c9c1ae" stroke="#f6f2ea" stroke-width="1"/>
<rect x="88" y="370" width="56" height="30" fill="#a9b4a3" stroke="#f6f2ea" stroke-width="1"/>
<rect x="144" y="370" width="56" height="30" fill="#b9a58e" stroke="#f6f2ea" stroke-width="1"/>
<rect x="200" y="370" width="56" height="30" fill="#9fa9b3" stroke="#f6f2ea" stroke-width="1"/>
<rect x="256" y="370" width="56" height="30" fill="#d4cbb8" stroke="#f6f2ea" stroke-width="1"/>
<rect x="312" y="370" width="56" height="30" fill="#b3a9a0" stroke="#f6f2ea" stroke-width="1"/>
<rect x="368" y="370" width="56" height="30" fill="#c2b79c" stroke="#f6f2ea" stroke-width="1"/>
<rect x="424" y="370" width="56" height="30" fill="#aab2a0" stroke="#f6f2ea" stroke-width="1"/>
<text x="32" y="418" font-size="12" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">File-type fills: muted earth and slate, like hand-tinted plates; no neon.</text>
<text x="32" y="442" font-size="11" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">Sketch. A dark variant keeps the same ink-on-paper contrast inverted.</text>
</svg>
