<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" fill="#1f1d1a">
<title>Inventory in two columns</title>
<rect width="900" height="520" fill="#f6f2ea"/>
<text x="32" y="44" font-size="20" fill="#1f1d1a" text-anchor="start" font-weight="normal">Cleanup — what you can rebuild, and what you cannot</text>
<text x="32" y="66" font-size="12" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">Move 1, option A · Epictetus, Enchiridion 1: what is up to us and what is not</text>
<line x1="32" y1="80" x2="868" y2="80" stroke="#1f1d1a" stroke-width="1"/>
<text x="32" y="116" font-size="15" fill="#1f1d1a" text-anchor="start" font-weight="normal">Can be rebuilt</text>
<text x="32" y="134" font-size="11" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">Tools will make these again. Removing them costs time, not data.</text>
<text x="472" y="116" font-size="15" fill="#1f1d1a" text-anchor="start" font-weight="normal">Only you have these</text>
<text x="472" y="134" font-size="11" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">Never suggested for removal. Shown so you know where the space is.</text>
<line x1="450" y1="100" x2="450" y2="470" stroke="#b9b2a5" stroke-width="1"/>
<rect x="32" y="159" width="12" height="12" fill="none" stroke="#1f1d1a"/>
<text x="54" y="170" font-size="13" fill="#1f1d1a" text-anchor="start" font-weight="normal">Xcode DerivedData</text>
<text x="430" y="170" font-size="13" fill="#1f1d1a" text-anchor="end" font-weight="normal">38.2 GB</text>
<line x1="32" y1="180" x2="430" y2="180" stroke="#b9b2a5" stroke-width="1"/>
<rect x="32" y="193" width="12" height="12" fill="none" stroke="#1f1d1a"/>
<text x="54" y="204" font-size="13" fill="#1f1d1a" text-anchor="start" font-weight="normal">node_modules (14 projects)</text>
<text x="430" y="204" font-size="13" fill="#1f1d1a" text-anchor="end" font-weight="normal">21.7 GB</text>
<line x1="32" y1="214" x2="430" y2="214" stroke="#b9b2a5" stroke-width="1"/>
<rect x="32" y="227" width="12" height="12" fill="none" stroke="#1f1d1a"/>
<text x="54" y="238" font-size="13" fill="#1f1d1a" text-anchor="start" font-weight="normal">Rust target/ (6 crates)</text>
<text x="430" y="238" font-size="13" fill="#1f1d1a" text-anchor="end" font-weight="normal">17.9 GB</text>
<line x1="32" y1="248" x2="430" y2="248" stroke="#b9b2a5" stroke-width="1"/>
<rect x="32" y="261" width="12" height="12" fill="none" stroke="#1f1d1a"/>
<text x="54" y="272" font-size="13" fill="#1f1d1a" text-anchor="start" font-weight="normal">Docker images</text>
<text x="430" y="272" font-size="13" fill="#1f1d1a" text-anchor="end" font-weight="normal">12.4 GB</text>
<line x1="32" y1="282" x2="430" y2="282" stroke="#b9b2a5" stroke-width="1"/>
<rect x="32" y="295" width="12" height="12" fill="none" stroke="#1f1d1a"/>
<text x="54" y="306" font-size="13" fill="#1f1d1a" text-anchor="start" font-weight="normal">Application caches</text>
<text x="430" y="306" font-size="13" fill="#1f1d1a" text-anchor="end" font-weight="normal">8.1 GB</text>
<line x1="32" y1="316" x2="430" y2="316" stroke="#b9b2a5" stroke-width="1"/>
<rect x="32" y="329" width="12" height="12" fill="none" stroke="#1f1d1a"/>
<text x="54" y="340" font-size="13" fill="#1f1d1a" text-anchor="start" font-weight="normal">Simulators (iOS 16, 17)</text>
<text x="430" y="340" font-size="13" fill="#1f1d1a" text-anchor="end" font-weight="normal">6.6 GB</text>
<line x1="32" y1="350" x2="430" y2="350" stroke="#b9b2a5" stroke-width="1"/>
<text x="472" y="170" font-size="13" fill="#1f1d1a" text-anchor="start" font-weight="normal">Photos Library</text>
<text x="868" y="170" font-size="13" fill="#1f1d1a" text-anchor="end" font-weight="normal">118 GB</text>
<line x1="472" y1="180" x2="868" y2="180" stroke="#b9b2a5" stroke-width="1"/>
<text x="472" y="204" font-size="13" fill="#1f1d1a" text-anchor="start" font-weight="normal">Movies — family 2019–2026</text>
<text x="868" y="204" font-size="13" fill="#1f1d1a" text-anchor="end" font-weight="normal">64 GB</text>
<line x1="472" y1="214" x2="868" y2="214" stroke="#b9b2a5" stroke-width="1"/>
<text x="472" y="238" font-size="13" fill="#1f1d1a" text-anchor="start" font-weight="normal">Documents</text>
<text x="868" y="238" font-size="13" fill="#1f1d1a" text-anchor="end" font-weight="normal">41 GB</text>
<line x1="472" y1="248" x2="868" y2="248" stroke="#b9b2a5" stroke-width="1"/>
<text x="472" y="272" font-size="13" fill="#1f1d1a" text-anchor="start" font-weight="normal">Mail</text>
<text x="868" y="272" font-size="13" fill="#1f1d1a" text-anchor="end" font-weight="normal">9.8 GB</text>
<line x1="472" y1="282" x2="868" y2="282" stroke="#b9b2a5" stroke-width="1"/>
<text x="32" y="420" font-size="12" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">Nothing is ticked until you tick it.</text>
<rect x="300" y="436" width="130" height="30" fill="none" stroke="#1f1d1a" stroke-width="1"/>
<text x="365" y="456" font-size="13" fill="#1f1d1a" text-anchor="middle" font-weight="normal">Move to Trash…</text>
<text x="32" y="502" font-size="11" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">Sketch, not a spec. Right column has no checkboxes: the app never offers to delete it.</text>
</svg>
