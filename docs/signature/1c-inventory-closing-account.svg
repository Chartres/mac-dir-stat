<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" fill="#1f1d1a">
<title>Closing account</title>
<rect width="900" height="420" fill="#f6f2ea"/>
<text x="32" y="44" font-size="20" fill="#1f1d1a" text-anchor="start" font-weight="normal">After cleanup — a short account</text>
<text x="32" y="66" font-size="12" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">Move 1, option C · Seneca, Letters to Lucilius 2 and 5: take stock, keep what serves</text>
<line x1="32" y1="80" x2="868" y2="80" stroke="#1f1d1a" stroke-width="1"/>
<text x="60" y="130" font-size="15" fill="#1f1d1a" text-anchor="start" font-weight="normal">Moved to Trash</text>
<text x="840" y="130" font-size="15" fill="#1f1d1a" text-anchor="end" font-weight="normal">84.3 GB</text>
<line x1="60" y1="142" x2="840" y2="142" stroke="#b9b2a5" stroke-width="1"/>
<text x="60" y="174" font-size="15" fill="#6b655c" text-anchor="start" font-weight="normal">of which can be rebuilt</text>
<text x="840" y="174" font-size="15" fill="#6b655c" text-anchor="end" font-weight="normal">84.3 GB</text>
<line x1="60" y1="186" x2="840" y2="186" stroke="#b9b2a5" stroke-width="1"/>
<text x="60" y="218" font-size="15" fill="#6b655c" text-anchor="start" font-weight="normal">of which only you had</text>
<text x="840" y="218" font-size="15" fill="#6b655c" text-anchor="end" font-weight="normal">0 B</text>
<line x1="60" y1="230" x2="840" y2="230" stroke="#b9b2a5" stroke-width="1"/>
<text x="60" y="262" font-size="15" fill="#1f1d1a" text-anchor="start" font-weight="normal">Free on Macintosh HD now</text>
<text x="840" y="262" font-size="15" fill="#1f1d1a" text-anchor="end" font-weight="normal">212.6 GB of 994 GB</text>
<line x1="60" y1="274" x2="840" y2="274" stroke="#b9b2a5" stroke-width="1"/>
<text x="60" y="320" font-size="12" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">The Trash is not emptied. Until you empty it, everything above can be taken back out.</text>
<rect x="700" y="340" width="140" height="30" fill="none" stroke="#1f1d1a" stroke-width="1"/>
<text x="770" y="360" font-size="13" fill="#1f1d1a" text-anchor="middle" font-weight="normal">Close</text>
<text x="32" y="402" font-size="11" fill="#6b655c" text-anchor="start" font-weight="normal" font-style="italic">Sketch. No confetti, no score, no streak. One quiet line also stays in the status bar.</text>
</svg>
